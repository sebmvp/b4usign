[project]
name = "before-you-sign"
version = "0.1.0"
description = "Property intelligence from official Miami-Dade public records."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "duckdb>=1.3",
  "fastapi>=0.116",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "sqlalchemy>=2.0",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the local PostGIS database",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
